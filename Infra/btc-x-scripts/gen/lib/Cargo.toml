[package]
name = "btcx_gen"
version = "0.1.0"
edition = "2021"
publish = false

description = "Shared library for the btcx address/mnemonic generation tools"

[dependencies]
bitcoin = { version = "0.32", features = ["std", "rand"] }
bip39 = { version = "2.2", features = ["rand"] }
bs58 = "0.5"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"